[project]
name = "factory"
version = "0.2.1"
description = "Roxabi Factory — Personal AI agent engine"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=48.0.0",
    "pydantic>=2.13.4",
    # Adapters
    "aiogram>=3.29.0",       # Telegram — Bot API 10.1 Rich Messages (sendRichMessage)
    "discord.py[voice]>=2.7.1",  # Discord — gateway WebSocket + voice support (voice extra pulls pynacl + davey for crypto; keep updated)
    # TODO(#271): CVE-2025-69277 — pynacl 1.5.0 needs upgrade to >=1.6.2 once discord.py
    # relaxes its pynacl<1.6 Windows constraint.
    # HTTP (webhook server for Telegram + inter-machine calls)
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.46.0",
    "httpx[asyncio]>=0.28",
    "python-dotenv>=1.2.2",
    # NATS transport (NatsBus — issue #455, Slice C of #445).
    # Do NOT add nats-py or nkeys here — they arrive transitively via
    # roxabi-nats (packages/roxabi-nats/pyproject.toml is the canonical
    # source). See issue #731.
    "roxabi-nats",
    # Shared NATS satellite plumbing (blobstore, tokens, domain validation/replies).
    "roxabi-satellite",
    # Workspace presence for V1 (#1063); consumers wire BlobStore in V2+ (#1064-#1068).
    "roxabi-blobs",
    "roxabi-obs",
    "roxabi-otel",
    "grpcio>=1.70.0",
    "opentelemetry-proto>=1.30.0",
    "typer>=0.26.7",
    "tomli-w>=1.0",
    "telegramify-markdown>=1.1.5",
    "tabulate>=0.9",
    "pyyaml>=6.0",
    "ag-ui-protocol>=0.1.19",
]

[project.scripts]
factory = "factory.cli:factory_main"
factory-agent = "factory.cli:agent_main"
factory-acl = "scripts.gen_nkeys:main"
factory-genkeys = "scripts.gen_nkeys:alias_genkeys"
factory-check-acl-retired = "scripts.gen_nkeys:_check_retired"
factory-check-flows = "scripts.gen_nkeys:_check_flows"
factory-check-grants = "scripts.gen_nkeys:_check_grants"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
override-dependencies = [
    "torch>=2.7",
    "torchaudio>=2.7",
    # chatterbox pins transformers==4.46.3, qwen-tts pins ==4.57.3; 5.x breaks qwen_tts
    "transformers>=4.57.3,<5",
    # chatterbox pins numpy<1.26.0 which doesn't build on Python 3.12
    "numpy>=1.26",
    # pandas 2.1.0 doesn't build on 3.12, gradio pulls it in
    "pandas>=2.2",
    # ml-dtypes/onnx need numpy 2.x compat builds
    "ml-dtypes>=0.5",
    "onnx>=1.20",
    "pynacl>=1.6.2",  # CVE-2025-69277 — discord.py 2.7.1 pins <1.6 but 1.6.x is API-compatible (discord.py master confirmed)
    "aiohttp>=3.13.4",  # CVE-2026-34520 + 9 others fixed in 3.13.4 (transitive via aiogram); drop-in, no API changes
    "pygments>=2.20.0",  # CVE-2026-4539 ReDoS fixed in 2.20.0 (dev-only, transitive via rich/pytest)
    "idna>=3.15",  # CVE-2026-45409 ReDoS (incomplete 2024 fix) — transitive via anyio/httpx/requests/yarl
    "starlette>=1.0.1",  # PYSEC-2026-161 Host-header path-prepend auth-bypass — via fastapi (0.136.3 accepts any starlette)
    "urllib3>=2.7.0",  # PYSEC-2026-141/142 (proxy-auth on cross-origin redirect + brotli OOM) — dev-only, transitive via requests→pip-audit
]

[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[tool.uv.workspace]
members = [
    "packages/roxabi-nats",
    "packages/roxabi-contracts",
    "packages/roxabi-blobs",
    "packages/roxabi-satellite",
    "packages/roxabi-obs",
    "packages/roxabi-otel",
]

[tool.uv.sources]
roxabi-contracts = { workspace = true }
roxabi-nats = { workspace = true }
roxabi-blobs = { workspace = true }
roxabi-satellite = { workspace = true }
roxabi-obs = { workspace = true }
roxabi-otel = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/factory", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
    "tests",
    "packages/roxabi-nats/tests",
    "packages/roxabi-contracts/tests",
    "packages/roxabi-blobs/tests",
    "packages/roxabi-satellite/tests",
    "packages/roxabi-obs/tests",
    "packages/roxabi-otel/tests",
]
addopts = "--import-mode=importlib -n auto --dist=loadgroup"
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    # Temporary suppression — remove when #1035 lands (module deletion)
    # Message pattern is matched via re.match (prefix, not full-string): match on the
    # "factory.monitoring.checks" prefix shared by checks.py's warning text, since the
    # full wording ("... (the aggregate Layer-1 runner) is deprecated ...") breaks a
    # naive "factory.monitoring.checks is deprecated" substring match.
    "ignore:factory.monitoring.checks:DeprecationWarning",
]
markers = [
    "nats_integration: NATS integration tests requiring Docker Compose",
    "integration: cross-host integration tests requiring M1 Tailnet",
    "subprocess_nats: tests spawning a local nats-server subprocess (no auth.conf)",
    "live_acl: live nats-server with rendered auth.conf and nk seeds",
    "deploy_contract: deploy/install/converge/quadlet bash contract tests",
    "nk_tooling: tests shelling out to the nk binary on PATH (no live nats-server)",
    "audio_consumer_live: test exercises audio consumer directly; skip the autouse no-op neutralizer",
    "bot_store_live: test exercises real BotStore roster loading; skip autouse roster mocks",
    "smoke: fast in-process smoke tests for critical user-facing paths",
    "omp_contract: OMP wire + driver + codec + E2E contract regression gate",
    "no_default_trace: skip autouse TraceContext fixture (unset-trace assertions)",
]

[tool.coverage.run]
branch = true
source = ["factory", "roxabi_nats", "roxabi_contracts", "roxabi_blobs"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "tools", "packages/roxabi-nats/src", "packages/roxabi-contracts/src", "packages/roxabi-blobs/src", "packages/roxabi-obs/src", "packages/roxabi-satellite/src"]
venvPath = "."
venv = ".venv"
# ── Permanent policy ──────────────────────────────────────────────────────────
#
# reportPrivateUsage: Python's _name is a convention (advisory), not access
# control. Pyright enforcing it generates false positives on tightly-coupled
# partner modules, stdlib internals, and white-box test access — none of which
# represent real violations. Enforced by code review, not by the type checker.
reportPrivateUsage = "none"
#
# reportUnusedFunction: Decorator-registered callables (Discord app_commands,
# Telegram update handlers, asyncio task targets) are not statically reachable.
# Confirmed by manual audit 2026-03-23: all 48 src hits are dynamic registrations
# or private module helpers called through the module's public entry point.
reportUnusedFunction = "none"
# ── Wave 4 (#411) — config loading migrated to Pydantic ──────────────────────
# Rules still suppressed: cascading errors from non-config dict[str, Any] in
# business logic, LLM drivers, and tests (~3,165 hits total). Config sites
# are now fully typed. Re-enable incrementally in follow-up issues.
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"

[tool.ruff]
src = ["src", "tests", "packages/roxabi-nats/src", "packages/roxabi-nats/tests", "packages/roxabi-contracts/src", "packages/roxabi-contracts/tests", "packages/roxabi-blobs/src", "packages/roxabi-blobs/tests", "packages/roxabi-satellite/src", "packages/roxabi-satellite/tests"]
exclude = [".claude/worktrees", "deploy"]
# Vendored gate scripts, copied from roxabi-plugins/plugins/dev-core/tools.
# tools/ also holds host-owned gates, so the directory stays in scope — only
# these four filenames are excluded. Formatting them rewrites upstream bytes
# (or, for license_check.py, the declared local variant) and recreates the
# drift ssot-verify V18 reports.
extend-exclude = [
    "tools/check_file_length.sh",
    "tools/check_folder_size.sh",
    "tools/check_lib.sh",
    "tools/license_check.py",
]
# Explicit paths bypass exclude unless force-exclude is set; ruff check/format
# on a staged or named file is inert without this.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "C901", "PLR0913", "PLR0915", "BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 5

[tool.ruff.format]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "import-linter>=2.11,<3",
    "jsonschema>=4.26.0",
    "pip-audit>=2.10.0",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.15",
    # Workspace member [testing] extras — pulls scipy+numpy needed by
    # roxabi_contracts.voice.fixtures. `uv sync` doesn't auto-expand
    # extras on workspace members (#1174), so we declare them here.
    "roxabi-blobs[testing]",
    "roxabi-contracts[testing]",
    "roxabi-nats[testing]",
    "roxabi-otel[testing]",
    "radon>=6.0",
    "playwright>=1.49.0",
    "pillow>=11.0.0",
    "pytest-rerunfailures>=16.4",
]
