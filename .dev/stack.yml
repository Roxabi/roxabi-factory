# .dev/stack.yml — dev-core stack configuration
schema_version: "1.0"

runtime: python
package_manager: uv

backend:
  framework: typer
  path: src/factory

frontend:
  package_manager: bun
  workspaces: [apps/dashboard-v2, packages, brand]
  lint_cmd: bun run lint
  format_cmd: bun run format
  test_cmd: bun run --filter @roxabi-factory/dashboard-v2 test
  build_cmd: bun run build:dashboard

build:
  formatter: ruff
  formatter_config: pyproject.toml
  formatter_fix_cmd: "uv run ruff format . && uv run ruff check --fix ."

testing:
  unit: pytest

lsp:
  enabled: true
  server: pyright

deploy:
  platform: podman

docs:
  framework: none
  path: docs
  format: md
  agent_entry: AGENTS.md        # agent instruction entrypoint (read explicitly, never imported)

commands:
  dev: uv run factory
  test: uv run pytest
  lint: uv run ruff check .
  format: uv run ruff format .
  typecheck: uv run pyright
  install: uv sync
  dev_setup: tools/dev-setup.sh
  qg: scripts/qg run
  worktree_setup: tools/worktree-setup.sh

# Language/layout conventions — see CONTRIBUTING.md § Language & layout
conventions:
  product:
    backend: python
    frontend: js_ts
  tooling:
    orchestration: bash # scripts/qg, drift wrappers, CI entrypoints
    quality_gates: tools/ # declared in quality_gates below; invoked only via scripts/qg
    domain_ops: scripts/ # ACL/deploy scanners; bash entry → python implementation
  requires:
    qg_runner: yq # pinned in tools/dev-setup.sh and .github/workflows/ci.yml

artifacts:
  analyses: artifacts/analyses
  specs: artifacts/specs
  frames: artifacts/frames
  plans: artifacts/plans

standards:
  architecture: docs/architecture
  deployment: docs/DEPLOYMENT.md
  configuration: docs/CONFIGURATION.md
  troubleshooting: docs/GETTING-STARTED.md
  contributing: docs/GETTING-STARTED.md

quality_gates:
  lint:
    enabled: true
    script: uv run ruff check .
    stages: [pre-commit, ci]

  typecheck:
    enabled: true
    script: uv run pyright
    # pre-push (not pre-commit): pyright costs ~10-22s per run — too heavy for
    # every commit, still blocks type errors before they reach CI.
    stages: [pre-push, ci]
    files: ^(src/|packages/[^/]+/src/|tests/|pyproject\.toml$)

  file_length:
    enabled: true
    max_lines: 300
    metric: sloc
    globs: ["src/**/*.py"]
    exemptions_file: tools/file_exemptions.txt
    stages: [pre-commit, ci]

  file_length_roxabi_nats:
    enabled: true
    script: tools/check_file_length.sh
    stages: [pre-commit]
    env:
      QG_FILE_ROOT: packages/roxabi-nats/src/
      QG_FILE_EXEMPTIONS: packages/roxabi-nats/tools/file_exemptions.txt

  file_length_roxabi_contracts:
    enabled: true
    script: tools/check_file_length.sh
    stages: [pre-commit]
    env:
      QG_FILE_ROOT: packages/roxabi-contracts/src/
      QG_FILE_EXEMPTIONS: packages/roxabi-contracts/tools/file_exemptions.txt

  file_exemptions:
    enabled: true
    script: tools/check_file_exemptions.sh
    stages: [pre-commit, ci]
    description: every entry in file_exemptions.txt must have a non-expired expires=YYYY-MM-DD token

  hardcoded_constants:
    enabled: true
    script: tools/check_hardcoded_constants.sh
    stages: [pre-commit, ci]
    description: block new hardcoded numeric literals in src/factory/core/

  folder_size:
    enabled: true
    max_files: 15
    globs: ["src/**"]
    exemptions_file: tools/folder_exemptions.txt
    stages: [pre-commit, ci]

  duplicate_test_basenames:
    enabled: true
    script: tools/check_duplicate_test_basenames.sh
    stages: [pre-commit, ci]
    source: pyproject.toml [tool.pytest.ini_options].testpaths

  import_layers:
    enabled: true
    config: .importlinter
    stages: [pre-commit, ci]

  codes_sync:
    enabled: true
    script: uv run python packages/roxabi-contracts/scripts/check_codes_sync.py --write
    ci_script: |
      uv run python packages/roxabi-contracts/scripts/check_codes_sync.py || EC=$?
      [[ ${EC:-0} -eq 0 || ${EC:-0} -eq 2 ]] || exit "${EC:-1}"
    stages: [pre-commit, ci]
    files: ^packages/roxabi-contracts/(src/roxabi_contracts/errors\.py|docs/error-codes\.md|scripts/check_codes_sync\.py)$

  lint_js:
    enabled: true
    script: bun run lint
    requires: bun
    stages: [pre-commit, ci]
    # Prefix alternation MUST NOT be $-anchored: the old pattern
    # ^(apps/|...)$ matched no nested file path, silently skipping biome on
    # every frontend change once files: filters are honored.
    files: ^(apps/|packages/|brand/)|^(biome\.json|package\.json|bun\.lock)$
    description: Biome lint on apps/packages/brand (#1771)

  dashboard_unit_test:
    enabled: true
    script: bun run --filter @roxabi-factory/dashboard-v2 test
    requires: bun
    stages: [pre-push, ci]
    files: ^(apps/dashboard-v2/|brand/)|^(bun\.lock|package\.json)$
    description: Vitest unit tests for dashboard SPA

  dashboard_build:
    enabled: true
    script: bun run build:dashboard
    requires: bun
    stages: [ci]
    # Superset of dashboard_unit_test's filter, plus e2e inputs:
    # src/factory/adapters/web/ serves the built SPA and ci.yml's dashboard
    # e2e step pytest.skips when apps/dashboard-v2/dist/ is missing — a PR
    # touching the web adapter or tests/e2e/dashboard-v2/ must trigger this
    # build or the e2e suite silently self-skips. MUST stay byte-identical to
    # dashboard_dist_assert's filter (asserted by tests/scripts/test_qg.sh).
    files: ^(apps/dashboard-v2/|brand/|src/factory/adapters/web/|tests/e2e/dashboard-v2/)|^(bun\.lock|package\.json)$
    description: Dashboard SPA production build

  dashboard_dist_assert:
    enabled: true
    script: test -f apps/dashboard-v2/dist/index.html
    stages: [ci]
    # MUST stay byte-identical to dashboard_build's filter: this gate asserts
    # the build output exists — running it when the build was skipped is a
    # guaranteed red. Identity asserted by tests/scripts/test_qg.sh.
    files: ^(apps/dashboard-v2/|brand/|src/factory/adapters/web/|tests/e2e/dashboard-v2/)|^(bun\.lock|package\.json)$

  trufflehog:
    enabled: true
    script: trufflehog git file://. --only-verified --fail
    requires: trufflehog
    stages: [pre-push]

  check_single_write_tool_display_config:
    enabled: true
    script: tools/check_single_write_tool_display_config.sh
    stages: [pre-push]

  no_runtime_toml_bots:
    enabled: true
    script: tools/check_no_runtime_toml_bots.sh
    stages: [pre-push, ci]

  license:
    enabled: true
    script: uv run tools/license_check.py
    stages: [pre-push, ci]

  architecture_snapshot:
    enabled: true
    script: tools/check_architecture_snapshot.sh
    stages: [pre-push, ci]

  qg_conf_drift:
    enabled: true
    script: bash scripts/check-qg-conf-drift.sh
    stages: [pre-push, ci]

  acl_specs_drift:
    enabled: true
    script: bash scripts/check-acl-specs-drift.sh
    stages: [pre-push, ci]

  acl_authconf_drift:
    enabled: true
    script: bash scripts/check-acl-authconf-drift.sh
    stages: [pre-push, ci]

  debt_expiry:
    enabled: true
    script: tools/check_debt_expiry.sh
    stages: [pre-push, ci]

  test_sleep:
    enabled: true
    script: tools/check_test_sleep.sh
    stages: [pre-push, ci]

  doc_drift:
    enabled: true
    script: tools/check_doc_drift.py
    # Invoked only via doc_drift_bundle — no stages / run_order entry

  doc_semantic_drift:
    enabled: true
    script: tools/check_doc_semantic_drift.py
    # Invoked only via doc_drift_bundle — no stages / run_order entry

  agents_no_adr_refs:
    enabled: true
    script: tools/check_agents_no_adr_refs.sh
    # Invoked only via doc_drift_bundle — no stages / run_order entry

  doc_drift_bundle:
    enabled: true
    # pre-push too: symbol deletions repeatedly reach CI as doc-drift reds
    # (fresh deletions are not grandfathered by the baseline) — catch pre-push.
    stages: [pre-push, ci]
    description: legacy symbol grep + doc_drift + doc_semantic_drift + agents_no_adr_refs

  pytest_smoke:
    enabled: true
    script: PYTHONPATH=src uv run pytest tests/ -m smoke -q
    stages: [pre-push]
    description: fast in-process smoke tests — the only local pytest net (full suites run in CI); PYTHONPATH=src so worktree pushes test the worktree src, not the main checkout's editable install

  pytest_partition:
    enabled: true
    script: PYTHONPATH=src uv run python tools/check_pytest_partition.py
    stages: [ci]
    files: ^(tests/|packages/roxabi-nats/tests/|pyproject\.toml$|\.github/workflows/ci\.yml$|scripts/ci-pytest\.sh$|tools/(check_pytest_partition|pytest_partitions)\.py$)
    description: CI pytest job partitions are disjoint and cover each pool (collect-only; SSoT tools/pytest_partitions.py)

  pytest_dir_markers:
    enabled: true
    script: PYTHONPATH=src uv run python tools/check_pytest_dir_markers.py
    stages: [ci]
    files: ^(tests/|packages/roxabi-nats/tests/|tools/(check_pytest_dir_markers|pytest_partitions)\.py$)
    description: Infra/integration markers only under allowed directory prefixes (SSoT MARKER_DIR_ALLOWLIST)

  secrets_drift:
    enabled: true
    script: tools/check_secrets_drift.sh
    stages: [pre-push, ci]

  volumes_table:
    enabled: true
    script: tools/check_volumes_table.sh
    stages: [pre-push, ci]

  quadlet_manifest_install:
    enabled: true
    script: tools/check_quadlet_manifest_install.sh
    stages: [pre-push, ci]

  quadlet_component_source:
    enabled: true
    script: tools/check_quadlet_component_source.sh
    stages: [ci]

  secrets_source:
    enabled: true
    script: tools/check_secrets_source.sh
    # ci: wired for parity; skips (exit 0) when ~/.roxabi/factory absent on runners
    stages: [pre-push, ci]

  str_exc_bus_bound:
    enabled: true
    script: tools/check_str_exc_bus_bound.sh
    stages: [ci]
    files: ^src/

  omp_pin_lockstep:
    enabled: true
    script: tools/check_omp_pin_lockstep.sh
    stages: [ci]
    files: ^(deploy/omp|src/factory/adapters/omp)

  acl_matrix_retired:
    enabled: true
    script: uv run factory-check-acl-retired
    stages: [ci]

  request_reply_flows:
    enabled: true
    script: uv run factory-check-flows
    stages: [ci]

  acl_grants:
    enabled: true
    script: uv run factory-acl check grants --matrix deploy/nats/acl-matrix.json
    stages: [ci]

  inbox_prefix:
    enabled: true
    script: bash scripts/check_inbox_prefix.sh
    stages: [ci]

  subject_literals:
    enabled: true
    script: bash scripts/check_subject_literals.sh
    stages: [ci]

qg:
  change_classes:
    docs:
      paths: ^(docs/|artifacts/)|AGENTS\.md$|\.md$|^\.claude/|^\.dev/
    python:
      paths: ^(src/|packages/[^/]+/src/|tests/|pyproject\.toml$|uv\.lock$)
    frontend:
      paths: ^(apps/|packages/shared/|brand/)|^(biome\.json|bun\.lock|package\.json)$
    deploy:
      paths: ^(deploy/|docker/)
    tooling:
      paths: ^(scripts/|\.github/|\.dev/stack\.yml$|tools/)
  tripwires:
    - ^pyproject\.toml$
    - ^uv\.lock$
    - ^package\.json$
    - ^bun\.lock$
    - ^\.dev/stack\.yml$
    - ^\.github/workflows/ci\.yml$
    - ^scripts/qg$
  run_order:
    pre-commit:
      - lint
      - file_length
      - file_exemptions
      - hardcoded_constants
      - file_length_roxabi_nats
      - file_length_roxabi_contracts
      - folder_size
      - duplicate_test_basenames
      - import_layers
      - codes_sync
      - lint_js
    pre-push:
      - typecheck
      - pytest_smoke
      - doc_drift_bundle
      - dashboard_unit_test
      - trufflehog
      - check_single_write_tool_display_config
      - no_runtime_toml_bots
      - license
      - architecture_snapshot
      - qg_conf_drift
      - acl_specs_drift
      - acl_authconf_drift
      - secrets_drift
      - quadlet_manifest_install
      - volumes_table
      - secrets_source
      - debt_expiry
      - test_sleep
    ci:
      - dashboard_build
      - lint_js
      - dashboard_unit_test
      - dashboard_dist_assert
      - file_length
      - file_exemptions
      - hardcoded_constants
      - str_exc_bus_bound
      - omp_pin_lockstep
      - qg_conf_drift
      - duplicate_test_basenames
      - pytest_partition
      - pytest_dir_markers
      - folder_size
      - no_runtime_toml_bots
      - doc_drift_bundle
      - secrets_drift
      - quadlet_manifest_install
      - volumes_table
      - secrets_source
      - quadlet_component_source
      - architecture_snapshot
      - debt_expiry
      - test_sleep
      - import_layers
      - lint
      - typecheck
      - license
      - codes_sync
      - acl_specs_drift
      - acl_authconf_drift
      - acl_matrix_retired
      - request_reply_flows
      - acl_grants
      - inbox_prefix
      - subject_literals
  profiles:
    local:
      - lint_js
      - lint
      - typecheck
      - dashboard_build
      - dashboard_unit_test
      - import_layers
      - acl_specs_drift
      - acl_authconf_drift
      - architecture_snapshot
      - secrets_drift
      - quadlet_manifest_install
      - volumes_table
      - secrets_source
      - file_length
      - folder_size
